---
version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  broker:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      #KAFKA_CREATE_TOPICS: "teamarenanais.aapen-arena-tiltakdeltakerendret-v1-q2:1:1,teamarenanais.aapen-arena-tiltakgjennomforingendret-v1-q2:1:1,teamarenanais.aapen-arena-tiltakssakendret-v1-q2:1:1"

#  ###### Postgres ######
  postgres-avtale:
    image: postgres:latest
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - dbdata-avtale:/var/lib/postgresql/data
    ports:
      - 6432:5432
  postgres-refusjon:
    image: postgres:latest
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - dbdata-refusjon:/var/lib/postgresql/data
    ports:
      - 7432:5432
  postgres-okonomi:
    image: postgres:latest
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - dbdata-okonomi:/var/lib/postgresql/data
    ports:
      - 8432:5432
  postgres-notifikasjon:
    image: postgres:latest
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - dbdata-notifikasjon:/var/lib/postgresql/data
    ports:
      - 9432:5432
  postgres-vedtaksbrev:
    image: postgres:latest
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    volumes:
      - dbdata-vedtaksbrev:/var/lib/postgresql/data
    ports:
      - 10432:5432
volumes:
  dbdata-avtale:
  dbdata-refusjon:
  dbdata-okonomi:
  dbdata-notifikasjon:
  dbdata-vedtaksbrev:
